<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ravenmoor Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/client/style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" hidden>
  <div class="top">
    <div class="panel status" id="status">
      <div class="nm"><span id="pname"></span><small>Lv <b id="plv">1</b> <span id="pcls">평민</span></small></div>
      <div class="bar hp"><i id="hpb"></i><span id="hpt"></span></div>
      <div class="bar mp" id="mpbar"><i id="mpb"></i><span id="mpt"></span></div>
      <div class="cuts" id="cuts" hidden></div>
      <div class="bar xp"><i id="xpb"></i><span id="xpt"></span></div>
      <div class="row"><span>금화 <b id="gold">0</b></span><span id="align"></span></div>
      <div class="buffs" id="buffs"></div>
    </div>
    <div class="mid"><div class="panel zone" id="zone"><span class="z">Ravenmoor</span><span id="zonet"></span><span id="clock"></span><span id="online"></span></div><div class="panel raidbar" id="raidbar" hidden></div><div class="panel bossbar" id="bossbar" hidden><div class="bn" id="bossname"></div><div class="bar hp"><i id="bosshp"></i><span id="bosshpt"></span></div></div></div>
    <div class="panel mm"><canvas id="minimap" width="160" height="160"></canvas></div>
  </div>
  <div id="party" class="panel" hidden></div>
  <div id="invites"></div>
  <div id="notice" class="panel" hidden></div>
  <div id="tip" class="panel" hidden></div>
  <div id="armhint" class="panel" hidden><b>공격</b> 대상을 클릭하거나, 땅을 클릭하면 싸우며 이동합니다 · <kbd>A</kbd> 한 번 더: 가장 가까운 적 · 우클릭/<kbd>Esc</kbd> 취소</div>
  <div class="panel target" id="target" hidden><div class="tn"><span id="tname"></span><em id="tlv"></em></div><div class="bar hp"><i id="thpb"></i><span id="thpt"></span></div><div class="tcast" id="tcast" hidden><i></i><span></span></div><div class="buffs" id="tbuffs"></div></div>
  <div class="panel castbar" id="castbar" hidden><i></i><span></span></div>
  <div class="bottom">
    <div class="chat">
      <div class="chattabs" id="chattabs"><button class="on" data-f="">모두</button><button data-f="near">주변</button><button data-f="party">파티</button><button data-f="guild">길드</button><button data-f="whisper">귓속말</button><button data-f="sys">알림</button></div>
      <div id="log"></div>
      <form id="chatform" autocomplete="off"><button type="button" id="chatch" title="Tab 키로 채널 바꾸기">일반</button><input id="chatin" maxlength="120" placeholder="Enter 키로 대화"></form>
    </div>
    <div class="right">
      <div class="keys"><span id="ctrlhint"></span> <kbd>Enter</kbd> 채팅 <kbd>L</kbd> 순위 <kbd>Esc</kbd> 멈춤/창 닫기 <button id="adminLink" class="link" hidden>운영 페이지</button><button id="logout" class="link">로그아웃</button></div>
      <div id="hotbar">
        <button class="hk atk" data-key="a"><kbd>A</kbd><small>공격</small></button>
        <span id="skillbar"></span>
        <button class="hk item" data-key="7"><kbd>7</kbd><small>HP 물약</small><span class="cnt" id="n1">0</span></button>
        <button class="hk item" data-key="8"><kbd>8</kbd><small>MP 물약</small><span class="cnt" id="n2">0</span></button>
        <button class="hk item" data-key="9"><kbd>9</kbd><small>귀향</small><span class="cnt" id="n3">0</span></button>
        <button class="hk" data-key="z"><kbd>Z</kbd><small>줍기</small></button>
        <button class="hk" data-key="i"><kbd>I</kbd><small>가방</small></button>
        <button class="hk" data-key="e"><kbd>E</kbd><small>장비</small></button>
        <button class="hk" data-key="c"><kbd>C</kbd><small>캐릭터</small></button>
        <button class="hk" data-key="t" id="talBtn"><kbd>T</kbd><small>특성</small><span class="cnt" id="talPts"></span></button>
        <button class="hk" data-key="q"><kbd>Q</kbd><small>의뢰</small></button>
        <button class="hk" data-key="m" id="muteBtn"><kbd>M</kbd><small>소리</small></button>
        <button class="hk" id="setBtn"><kbd>O</kbd><small>설정</small></button>
      </div>
    </div>
  </div>
</div>

<div id="join">
  <form class="panel joinbox" id="joinform" autocomplete="off">
    <h1>Ravenmoor Online</h1>
    <p class="sub">레이븐무어 · 성벽 안은 안전, 성문 밖은 무법지대</p>
    <div class="tabs"><button type="button" class="tab on" id="tabLogin">로그인</button><button type="button" class="tab" id="tabReg">새 캐릭터</button></div>
    <label for="jname">이름</label>
    <input id="jname" maxlength="10" placeholder="한글·영문 2~10자" autocomplete="username" required>
    <label for="jpass">비밀번호</label>
    <input id="jpass" type="password" minlength="6" maxlength="64" placeholder="6자 이상" autocomplete="current-password" required>
    <div id="lookRow" hidden><label>외형</label><div class="looks" id="looks"></div></div>
    <button type="submit" id="jbtn">입장</button>
    <p class="err" id="jerr" role="alert"></p>
    <p class="note">캐릭터는 서버에 저장되어 어느 기기에서든 이어서 할 수 있습니다.</p>
  </form>
</div>
<div id="dead" hidden><b>쓰러졌습니다…</b><small id="deadt"></small></div>
<div id="reconn" class="panel" hidden></div>
<div id="settings" class="win" hidden></div>
<script type="module" src="/client/main.js"></script>
</body>
</html>
